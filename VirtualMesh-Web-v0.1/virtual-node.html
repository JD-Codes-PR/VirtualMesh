<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VirtualMesh Node</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark}body{margin:0;background:#0b1020;color:#edf2ff}.wrap{max-width:760px;margin:40px auto;padding:20px}.card{background:#121a2e;border:1px solid #263252;border-radius:18px;padding:22px;margin:14px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.online{color:#7ee787}h1{margin:0;font-size:26px}.muted{color:#9ba9c8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{background:#0d1426;border-radius:12px;padding:12px}.stat b{display:block;margin-top:5px}select,textarea,input,button{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #334266;background:#0b1222;color:#fff;padding:12px;font:inherit}textarea{min-height:120px;resize:vertical}button{cursor:pointer;background:#1f6feb;border:0;font-weight:700}button.secondary{background:#293550}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.log{font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;max-height:260px;overflow:auto}.warn{color:#f2cc60}.ok{color:#7ee787}.err{color:#ff7b72}@media(max-width:560px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap">
<div class="top"><div><h1>VirtualMesh Node</h1><div class="muted">Panel privado · MQTT virtual node</div></div><div id="state" class="online">● cargando</div></div>
<div class="card"><div class="grid"><div class="stat">Node ID<b id="node">—</b></div><div class="stat">Long Name<b id="long">—</b></div><div class="stat">Short Name<b id="short">—</b></div><div class="stat">Versión<b id="ver">—</b></div></div></div>
<div class="card"><label>Token de acceso <span class="muted">(solo si configuraste VNODE_TOKEN)</span></label><input id="token" type="password" autocomplete="off" placeholder="Opcional"><br><br><label>Región / broker</label><select id="dest"></select><br><br><label>Mensaje</label><textarea id="msg" maxlength="220" placeholder="Escribe un mensaje Meshtastic..."></textarea><div class="row"><button id="send">ENVIAR BROADCAST</button><button id="announce" class="secondary">ANUNCIAR NODEINFO</button></div><p class="warn">Solo publica en destinos preconfigurados. No hay campo para topic o broker arbitrario.</p></div>
<div class="card"><b>Transmisión</b><div id="result" class="log muted">Esperando…</div></div>
</div><script>
const base=location.pathname.replace(/\/$/,''); const $=id=>document.getElementById(id); const headers=()=>({'content-type':'application/json',...( $('token').value?{'x-virtualmesh-token':$('token').value}:{})});
async function status(){try{let r=await fetch(base+'/api/status',{headers:headers()});let j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);$('state').textContent='● ONLINE';$('node').textContent=j.nodeId;$('long').textContent=j.longName;$('short').textContent=j.shortName;$('ver').textContent=j.version;let old=$('dest').value;$('dest').innerHTML=Object.entries(j.destinations).map(([k,d])=>`<option value="${k}" ${d.connected?'':'disabled'}>${d.label} · ${d.connected?'connected':'offline'}</option>`).join('');if(old&&[...$('dest').options].some(o=>o.value===old&&!o.disabled))$('dest').value=old;}catch(e){$('state').textContent='● acceso requerido';$('state').className='err';}}
async function post(path,body){$('result').textContent='Enviando…';try{let r=await fetch(base+path,{method:'POST',headers:headers(),body:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);$('result').className='log ok';$('result').textContent=JSON.stringify(j,null,2);status();}catch(e){$('result').className='log err';$('result').textContent=e.message;}}
$('send').onclick=()=>post('/api/send',{destination:$('dest').value,message:$('msg').value});$('announce').onclick=()=>post('/api/announce',{destination:$('dest').value});$('token').onchange=status;status();setInterval(status,10000);
</script></body></html>
