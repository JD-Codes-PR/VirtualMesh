<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Channel Intelligence · VirtualMesh</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eaf2ff;font:15px system-ui,Segoe UI,sans-serif}header{padding:22px 5%;background:#0c1b2e;position:sticky;top:0;z-index:3}h1{margin:0;font-size:24px}small,.muted{color:#93a8c3}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}nav a,.btn{color:#dcecff;text-decoration:none;background:#142a45;border:1px solid #294664;padding:9px 12px;border-radius:10px}.active{background:#21466f}main{padding:24px 5%;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card,.row{background:#0d1d30;border:1px solid #1e3856;border-radius:14px;padding:16px}.big{font-size:30px;font-weight:750}.row{margin:10px 0}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:12px;background:#17304d;padding:4px 7px;border-radius:8px}.text{font-size:16px;margin-top:10px;white-space:pre-wrap}input,select{background:#0a1727;color:#fff;border:1px solid #294664;padding:10px;border-radius:9px}table{width:100%;border-collapse:collapse}.scroll{overflow:auto}th,td{text-align:left;padding:10px;border-bottom:1px solid #1e3856}footer{padding:24px 5%;color:#7f96b3}code{color:#b9d9ff}</style><header><h1>VirtualMesh · Channel Intelligence</h1><small>v0.7.3 · READ ONLY · MQTT publish deshabilitado</small><nav><a href="/index.html">Dashboard</a><a href="/mensajes-monitor.html">Mensajes</a><a href="/conversaciones.html">Conversaciones</a><a href="/nodos.html">Nodos</a><a href="/red.html">Red</a><a href="/canales.html">Canales</a></nav></header><main><p>Observación y priorización de investigación. No promueve canales automáticamente.</p><div id="summary" class="grid"></div><div id="list"></div></main><footer>VirtualMesh v0.7.3 · Experience Layer · READ ONLY</footer><script>function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}async function load(){let d=await fetch('/api/channel-intelligence',{cache:'no-store'}).then(r=>r.json()),a=d.channels||[];let counts={};a.forEach(x=>counts[x.classification?.status||'DISCOVERY']=(counts[x.classification?.status||'DISCOVERY']||0)+1);summary.innerHTML=Object.entries(counts).map(([k,v])=>`<div class="card"><div class="big">${v}</div><div>${esc(k)}</div></div>`).join('');list.innerHTML=a.map(c=>`<div class="row"><div class="tags"><span class="tag">${esc(c.source)}</span><span class="tag">${esc(c.classification?.status||'DISCOVERY')}</span>${c.candidate?`<span class="tag">Score ${c.candidate.score??'—'} · ${esc(c.candidate.trafficType)}</span>`:''}</div><h3>${esc(c.channelId||'sin canal')}</h3><span class="muted">${c.packets||0} paquetes · ${c.textMessages||0} textos · ${c.uniqueNodes||0} nodos</span></div>`).join('')}load();setInterval(load,15000);</script></html>
